<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFAS Successcan | Beheerscan</title>
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link rel="stylesheet" href="css/nulmeting.css">
</head>
<body>
    <header class="app-header">
        <div>
            <div class="logo">AFAS Successcan</div>
            <div class="subtitle">Beheerscan — Nulmeting beheerorganisatie</div>
        </div>
        <button class="btn-header btn-home" onclick="Beheerscan.naarOverzicht()" title="Terug naar beginscherm">
            🏠 Overzicht
        </button>
        <button class="btn-header btn-stamkaart" id="btn-stamkaart" onclick="Beheerscan.openStamkaart()" disabled title="Vul eerst een verkooprelatienummer in">
            📇 Direct naar stamkaart
        </button>
        <button class="darkmode-toggle" onclick="Beheerscan.toggleDarkMode()" title="Donkere modus">
            <span class="darkmode-icon">🌙</span>
        </button>
    </header>

    <nav class="progress-container">
        <div class="progress-bar">
            <div class="progress-track">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="progress-steps">
                <div class="progress-step active" onclick="Beheerscan.goToStep(0)">
                    <div class="step-circle">①</div>
                    <span class="step-label">Start</span>
                </div>
                <div class="progress-step" onclick="Beheerscan.goToStep(1)">
                    <div class="step-circle">🏗️</div>
                    <span class="step-label">Structuur</span>
                </div>
                <div class="progress-step" onclick="Beheerscan.goToStep(2)">
                    <div class="step-circle">🎓</div>
                    <span class="step-label">Capaciteit</span>
                </div>
                <div class="progress-step" onclick="Beheerscan.goToStep(3)">
                    <div class="step-circle">⚙️</div>
                    <span class="step-label">Sturing</span>
                </div>
                <div class="progress-step" onclick="Beheerscan.goToStep(4)">
                    <div class="step-circle">🚀</div>
                    <span class="step-label">Ambitie</span>
                </div>
                <div class="progress-step" onclick="Beheerscan.goToStep(5)">
                    <div class="step-circle">📝</div>
                    <span class="step-label">Opmerkingen</span>
                </div>
                <div class="progress-step" onclick="Beheerscan.goToStep(6)">
                    <div class="step-circle">�</div>
                    <span class="step-label">Inrichting</span>
                </div>
                <div class="progress-step" onclick="Beheerscan.goToStep(7)">
                    <div class="step-circle">�📊</div>
                    <span class="step-label">Resultaat</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="wizard-main">
        <div id="wizard-content"></div>
    </main>

    <footer class="wizard-nav">
        <button class="btn-nav" id="btn-prev" onclick="Beheerscan.prevStep()">← Vorige</button>
        <button class="btn-nav" id="btn-next" onclick="Beheerscan.nextStep()">Volgende →</button>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js" integrity="sha512-UhysLWaoNuHnlznMHUjIKmB+/jM5vHKK7nPh+2kWqnVzleHgSHktAWTawR5lWgb2ZhkNaQ5V5q7aF19fgJvAmQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
        // Fallback voor XLSX library
        if (!window.XLSX) {
            var fallbackScript = document.createElement('script');
            fallbackScript.src = 'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js';
            fallbackScript.onload = function() {
                console.log('XLSX library loaded from fallback CDN');
                loadApplicationScripts();
            };
            fallbackScript.onerror = function() {
                console.error('Failed to load XLSX from any CDN');
                loadApplicationScripts(); // Toch laden, zal error geven bij Excel upload
            };
            document.head.appendChild(fallbackScript);
        } else {
            loadApplicationScripts();
        }
        
        function loadApplicationScripts() {
            var data = document.createElement('script');
            data.src = 'js/data.js';
            document.head.appendChild(data);
            
            var app = document.createElement('script');
            app.src = 'js/nulmeting.js';
            document.head.appendChild(app);
        }
    </script>
</body>
</html>
